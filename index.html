<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Cia 🩵</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e8f7ff,
                    #c9e9fa,
                    #b5d9ef
                );

            color: #294866;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .container {
            padding: 30px;
            max-width: 600px;
        }

        .small {
            letter-spacing: 4px;
            font-size: 12px;
            color: #5c7d98;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 60px;
            font-weight: normal;
            margin: 20px 0;
        }

        .date {
            color: #63829c;
            letter-spacing: 4px;
        }

        button {
            margin-top: 30px;

            padding: 14px 30px;

            border: none;
            border-radius: 30px;

            background: white;

            color: #294866;

            font-size: 15px;

            cursor: pointer;

            box-shadow:
                0 8px 25px
                rgba(70,110,140,0.15);
        }

        button:hover {
            transform: scale(1.05);
        }

    </style>
</head>


<body>

    <div class="container">

        <div class="small">
            A LITTLE SOMETHING FOR
        </div>


        <h1>
            Cia 🩵
        </h1>


        <div class="date">
            30 . 08 . 2026
        </div>


        <button onclick="birthday()">
            tap to enter ♫
        </button>

    </div>


    <script>

        function birthday() {

            alert(
                "HAPPY BIRTHDAY, CIA! 🎂🩵"
            );

        }

    </script>

</body>
  </html>
